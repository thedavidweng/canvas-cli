version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - unconvert
    - prealloc
    - unparam
    - godox
    - whitespace
    - nolintlint
  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        # DEVIATION from canonical: pass-by-value of JSON-envelope, audit, and
        # mutation DTOs is intentional in this one-shot CLI (no hot loops);
        # pointer-threading them for a micro-optimization is not worth the churn.
        - hugeParam
        - rangeValCopy
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/thedavidweng/canvas-cli

run:
  timeout: 5m
